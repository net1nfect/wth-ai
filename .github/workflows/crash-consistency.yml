name: crash-consistency

# Gate khusus kontrak crash-consistency & recovery.
#
# Kenapa job terpisah, bukan sekadar bagian dari `pytest tests/`: suite ini
# menguji JANJI keselamatan (langkah destruktif tidak diulang otomatis,
# checkpoint tidak hilang, resume tidak menurunkan status). Regresinya tidak
# muncul sebagai crash — hasilnya tetap hijau untuk test lain, dan yang
# hilang justru jaminan yang tidak terlihat. Job terpisah membuat kegagalan
# bernama jelas: "crash-consistency gagal", bukan "satu test di antara 1800".

on:
  push:
    branches: [main, master, develop, agentic]
  pull_request:

jobs:
  crash-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pytest tidak ada di requirements.txt (itu runtime deps), jadi gate CI
      # harus memasangnya eksplisit. Tanpa ini setiap step gagal dengan
      # "pytest: command not found" (exit 127) sebelum satu test pun jalan.
      - run: pip install -r requirements.txt pytest && pip install -e .
      - name: Simulasi crash end-to-end (ckpt nyata, resume berulang)
        run: |
          pytest -q --tb=short \
            tests/test_crash_simulation_e2e.py \
            tests/test_crash_consistency_fault_injection.py
      - name: Kontrak verifikasi destruktif
        run: |
          pytest -q --tb=short \
            tests/test_destructive_verify.py \
            tests/test_destructive_verify_generic.py
      - name: CAS checkpoint & kebijakan TTL
        run: |
          pytest -q --tb=short \
            tests/test_checkpoint_cas.py \
            tests/test_checkpoint_ttl.py
      - name: Digest definisi payload vs resume
        run: pytest -q --tb=short tests/test_autopilot_catalog_digest.py
      - name: Checkpoint per-tool recon
        run: |
          pytest -q --tb=short \
            tests/test_recon_per_tool_checkpoint.py \
            tests/test_recon_parallel_crash_ordering.py
      - name: Metadata risiko saran proaktif
        run: pytest -q --tb=short tests/test_proactive_risk_metadata.py
