[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wth-ai"
version = "1.0.0"
description = "Production-grade bug bounty AI CLI — dual-agent recon, hunt, verify"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.6",
    "python-dotenv>=1.2.2",
    "prompt-toolkit>=3.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.4",
    "discord.py>=2.3",
    "python-telegram-bot>=21.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
browser = ["nodriver>=0.38"]
tui = ["textual>=0.80"]
full = ["nodriver>=0.38", "aiohttp>=3.9", "dnspython>=2.4", "beautifulsoup4>=4.12", "lxml>=5.0", "textual>=0.80"]
mcp = ["mcp>=1.0.0"]

[project.scripts]
wth = "wth_ai.cli.entry:main"
wth-ai = "wth_ai.cli.entry:main"

[tool.setuptools.packages.find]
include = ["wth_ai*"]

[tool.setuptools.package-data]
# GAP-012: semua data runtime ikut wheel (pemuat memakai wth_ai.resources).
# Kunci subpaket dikutip penuh karena titik di TOML = tabel bersarang.
"wth_ai.prompts" = ["*.txt"]
"wth_ai.arena" = ["templates/*.yaml", "templates/*.yml", "**/*.txt", "**/*.json"]
"wth_ai.brain" = ["**/*.yaml", "**/*.yml"]
"wth_ai.tools" = ["**/*.yaml", "**/*.yml", "**/*.json"]
"wth_ai.recon" = ["**/*.yaml", "**/*.yml", "**/*.json"]

[tool.pyright]
include = ["wth_ai", "tests"]
extraPaths = ["."]
pythonVersion = "3.10"
typeCheckingMode = "basic"
